<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geometry Visual Tests</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #e6e9ec;
        background: #15191e;
      }
      body {
        margin: 0;
        padding: 24px 16px 40px;
      }
      header {
        max-width: 1100px;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      header p {
        margin: 0;
        color: #9aa4ad;
      }
      a {
        color: #ffd54a;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }
      .card {
        background: #1f252c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
      }
      .card h2 {
        margin: 0;
        padding: 10px 12px 2px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .card p {
        margin: 0;
        padding: 0 12px 8px;
        font-size: 12px;
        color: #9aa4ad;
      }
      canvas {
        display: block;
        width: 100%;
        height: 240px;
        background: #12161a;
        cursor: crosshair;
      }
      .readout {
        padding: 8px 12px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: #b7f5c4;
        white-space: pre;
        min-height: 3em;
      }
      .badge {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 99px;
        background: rgba(123, 216, 143, 0.15);
        color: #7bd88f;
      }
      .badge.fail {
        background: rgba(255, 107, 107, 0.15);
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Geometry library — visual tests</h1>
      <p>
        Move the mouse over each canvas. Every card also checks an invariant live and shows ✓ / ✗.
        Unit tests: <code>npm test</code>. Back to the <a href="../../index.html">simulator</a>.
      </p>
    </header>
    <main id="cards"></main>
    <script type="module" src="visual.js"></script>
  </body>
</html>
