name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: A* and Dijkstra agree (benchmark)
        run: npm run bench
      - name: Reproducible training smoke run
        run: npm run train -- configs/training/quick.json --out /tmp/quick
